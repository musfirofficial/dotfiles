# Force Kitty to be completely solid and kill blur
windowrulev2 = opaque, class:^(kitty.*)$
windowrulev2 = noblur, class:^(kitty.*)$
# Browser solid rules (uncomment/keep the one you use)
windowrulev2 = opaque, class:^(firefox)$
windowrulev2 = noblur, class:^(firefox)$

windowrulev2 = opaque, class:^(google-chrome)$
windowrulev2 = noblur, class:^(google-chrome)$

windowrulev2 = opaque, class:^(Brave-browser)$
windowrulev2 = noblur, class:^(Brave-browser)$

windowrulev2 = opaque, class:^(zen-alpha)$
windowrulev2 = noblur, class:^(zen-alpha)$

# Autostart Dunst notification daemon
exec-once = dunst
